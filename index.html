<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职业发展对话 · 个人练习工作台</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            applebg: '#F5F5F7',
            applesurface: '#FAFAFC',
            appletrack: '#E8E8ED',
            appleink: '#1D1D1F',
            applesecondary: '#6E6E73',
            applemuted: '#86868B',
            pine: {
              DEFAULT: '#0F5C56',
              hover: '#0B4641',
            },
            staramber: '#B45309'
          },
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"SF Pro Display"',
              '"SF Pro Text"',
              '"PingFang SC"',
              '"Hiragino Sans GB"',
              '"Microsoft YaHei"',
              'sans-serif'
            ],
          }
        }
      }
    };
  </script>

  <style>
    /* Apple 极简全局排版与色彩基底 */
    body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* 隐藏横向滚动条，保留顺滑触控滑动 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 0.5px 极细发丝分割线 */
    .hairline-b {
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
    }
    .hairline-t {
      border-top: 0.5px solid rgba(0, 0, 0, 0.08);
    }

    /* 无边框极简输入控件：静止态浅灰块，聚焦态纯白浮起 + 深松石绿柔光 */
    .apple-field {
      background-color: #F5F5F7;
      border: 1px solid transparent;
      border-radius: 14px;
      color: #1D1D1F;
      transition: background-color 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .apple-field::placeholder {
      color: #86868B;
    }
    .apple-field:hover {
      background-color: #EFEFF4;
    }
    .apple-field:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: rgba(15, 92, 86, 0.35);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04), 0 0 0 3px rgba(15, 92, 86, 0.08);
    }

    /* 柔和视图入场过渡 */
    @keyframes appleFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-apple-in {
      animation: appleFadeIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ==================== 瑞士网格刊物级 PDF 打印样式 ==================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 13mm 13mm 14mm 13mm;
      }

      body {
        background-color: #FFFFFF !important;
        color: #1D1D1F !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 隐藏所有网页交互外框 */
      #app-shell,
      .no-print {
        display: none !important;
      }

      /* 解除全屏弹窗定位，保证跨页自然排版 */
      #onepager-modal {
        position: static !important;
        inset: auto !important;
        display: block !important;
        overflow: visible !important;
        background: #FFFFFF !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
      }

      #onepager-modal-dialog {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }

      #onepager-printable {
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
      }

      /* 打印时强制锁定瑞士 35% / 65% 不对称双栏网格 */
      .swiss-print-grid {
        display: grid !important;
        grid-template-columns: 35% 1fr !important;
        gap: 24px !important;
      }

      .swiss-left-col {
        border-right: 0.5px solid rgba(0, 0, 0, 0.14) !important;
        padding-right: 20px !important;
      }

      .print-avoid-break {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ==================== 主工作台外框（导出 PDF 时自动隐藏） ==================== -->
  <div id="app-shell" class="flex-1 flex flex-col">

    <!-- 顶部毛玻璃导航栏 -->
    <header class="sticky top-0 z-30 bg-[#F5F5F7]/85 backdrop-blur-xl hairline-b">
      <div class="max-w-[940px] mx-auto px-4 sm:px-6 pt-3.5 pb-0">

        <!-- 第一行：极简品牌标识 + 右侧单行控制区 -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-3.5">
          <!-- 左侧品牌标题 -->
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-[10px] bg-white shadow-[0_1px_4px_rgba(0,0,0,0.06)] flex items-center justify-center text-[#1D1D1F] shrink-0" id="brand-icon-slot"></div>
            <div class="min-w-0">
              <h1 class="text-[16px] sm:text-[17px] font-semibold tracking-[-0.015em] text-[#1D1D1F] leading-snug truncate">
                职业发展对话 · 个人练习工作台
              </h1>
              <p class="text-[12px] text-[#86868B] leading-tight mt-0.5 truncate">
                Opentalk · 职业发展对话实战与应用
              </p>
            </div>
          </div>

          <!-- 右侧全局工具栏（单行水平对齐） -->
          <div class="flex items-center justify-between sm:justify-end gap-2.5 shrink-0">
            <!-- 无边框内联姓名/邮箱编辑区 -->
            <div class="group inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-transparent hover:bg-[#E8E8ED]/80 focus-within:bg-[#E8E8ED] transition-colors">
              <span class="text-[#86868B] group-hover:text-[#1D1D1F] transition-colors shrink-0" id="header-pencil-slot"></span>
              <input type="text" id="header-student-name"
                aria-label="输入姓名或公司邮箱"
                placeholder="输入姓名或公司邮箱"
                oninput="onStudentNameChange(this.value)"
                class="w-36 sm:w-44 text-[13px] font-medium text-[#1D1D1F] placeholder-[#86868B] bg-transparent focus:outline-none truncate" />
            </div>

            <!-- 极简自动保存微指示 -->
            <div id="save-status-text" class="text-[12px] text-[#86868B] transition-colors duration-300 whitespace-nowrap select-none">
              ✓ 已保存
            </div>

            <!-- 唯一实心品牌主按钮：预览/打印 -->
            <button type="button" onclick="openOnePagerModal()"
              class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[#0F5C56] hover:bg-[#0B4641] active:scale-[0.99] text-white text-[13px] font-medium transition-all shadow-[0_2px_8px_rgba(15,92,86,0.18)] cursor-pointer whitespace-nowrap shrink-0">
              <span id="header-print-icon-slot"></span>
              <span>预览/打印</span>
            </button>
          </div>
        </div>

        <!-- 第二行：Apple Segmented Control（阶段分段控制器） -->
        <div class="pb-3">
          <div id="stage-segmented-control" role="tablist" aria-label="课程阶段切换"
            class="inline-flex items-center bg-[#E8E8ED] p-[3px] rounded-[10px] w-full sm:w-auto overflow-x-auto no-scrollbar">
            <!-- JS 动态渲染 -->
          </div>
        </div>

        <!-- 第三行：Safari 风格极简子步骤导航（仅在阶段一展开，阶段二/三彻底隐藏） -->
        <div id="substep-underline-bar" class="flex items-center gap-6 overflow-x-auto no-scrollbar pt-0.5">
          <!-- JS 动态渲染 -->
        </div>

      </div>
    </header>

    <!-- 主工作区容器 -->
    <main class="flex-1 max-w-[940px] w-full mx-auto px-4 sm:px-6 pt-7 sm:pt-9 pb-24">
      <div id="step-view" class="animate-apple-in">
        <!-- JS 动态渲染当前视图 -->
      </div>
    </main>

    <!-- 极简页脚（连续点击 3 次可呼出讲师后台端点配置） -->
    <footer class="py-6 text-center text-[12px] text-[#86868B] select-none px-4">
      <span id="footer-secret-trigger" class="cursor-default">
        Opentalk · 职业发展对话实战与应用 · 使用同一姓名或公司邮箱可在多设备同步最新进度
      </span>
    </footer>
  </div>

  <!-- ==================== 瑞士网格刊物级《职业发展对话准备单》预览与 PDF 导出弹窗 ==================== -->
  <div id="onepager-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black/35 backdrop-blur-md p-3 sm:p-6 md:p-10">
    <div id="onepager-modal-dialog" class="max-w-[880px] mx-auto my-1 sm:my-3 animate-apple-in">

      <!-- 悬浮毛玻璃工具栏（打印时自动隐藏） -->
      <div class="no-print mb-4 bg-white/90 backdrop-blur-xl rounded-full px-4 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 shadow-[0_8px_30px_rgba(0,0,0,0.08)]">
        <div class="flex items-center gap-2 pl-1">
          <span class="w-2 h-2 rounded-full bg-[#0F5C56]"></span>
          <span class="text-[13px] font-medium text-[#1D1D1F]">高管级《职业发展对话准备单》预览</span>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" onclick="copyFullSummaryText()"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[13px] font-medium text-[#1D1D1F] bg-[#F5F5F7] hover:bg-[#E8E8ED] transition cursor-pointer">
            <span id="modal-copy-icon"></span>
            <span>复制纯文本</span>
          </button>

          <button type="button" onclick="triggerPrintOnePager()"
            class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-[13px] font-medium text-white bg-[#0F5C56] hover:bg-[#0B4641] transition cursor-pointer">
            <span id="modal-print-icon"></span>
            <span>导出 PDF / 打印</span>
          </button>

          <button type="button" onclick="closeOnePagerModal()" aria-label="关闭预览"
            class="w-8 h-8 rounded-full flex items-center justify-center text-[#6E6E73] hover:text-[#1D1D1F] hover:bg-[#F5F5F7] transition cursor-pointer">
            <span id="modal-close-icon"></span>
          </button>
        </div>
      </div>

      <!-- 纯白瑞士刊物主体（无边框大画布） -->
      <div id="onepager-printable" class="bg-white rounded-[20px] p-6 sm:p-10 md:p-12 shadow-[0_12px_40px_rgba(0,0,0,0.08)]">
        <!-- JS 动态渲染瑞士网格报告 -->
      </div>
    </div>
  </div>

  <!-- ==================== 极简浮层轻提示 Toast ==================== -->
  <div id="toast-box" class="no-print fixed bottom-7 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <!-- ==================== 隐蔽后台端点配置弹窗（三击页脚呼出） ==================== -->
  <div id="archive-config-modal" class="no-print fixed inset-0 z-50 hidden items-center justify-center bg-black/30 backdrop-blur-xs p-4">
    <div class="bg-white rounded-[20px] max-w-md w-full p-6 sm:p-7 shadow-[0_20px_50px_rgba(0,0,0,0.12)] animate-apple-in">
      <h3 class="text-[17px] font-semibold text-[#1D1D1F]">课程归档端点配置</h3>
      <p class="text-[13px] text-[#6E6E73] mt-1.5 leading-relaxed">
        粘贴 Google Apps Script 部署后的 Web App URL，系统将在后台静默同步 25 列结构化数据。留空则仅保存在本地浏览器。
      </p>
      <div class="mt-4">
        <label for="config-sheet-url" class="block text-[12px] font-medium text-[#86868B] mb-1.5">Web App URL</label>
        <input type="url" id="config-sheet-url" placeholder="https://script.google.com/macros/s/.../exec"
          class="w-full px-3.5 py-2.5 text-[13px] apple-field" />
      </div>
      <div class="mt-6 flex items-center justify-end gap-2">
        <button type="button" onclick="closeArchiveConfig()"
          class="px-4 py-2 rounded-full text-[13px] font-medium text-[#6E6E73] bg-[#F5F5F7] hover:bg-[#E8E8ED] transition cursor-pointer">
          取消
        </button>
        <button type="button" onclick="saveArchiveConfig()"
          class="px-4 py-2 rounded-full text-[13px] font-medium text-white bg-[#0F5C56] hover:bg-[#0B4641] transition cursor-pointer">
          保存配置
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 清空重置二次确认弹窗 ==================== -->
  <div id="reset-confirm-modal" class="no-print fixed inset-0 z-50 hidden items-center justify-center bg-black/30 backdrop-blur-xs p-4">
    <div class="bg-white rounded-[20px] max-w-md w-full p-6 sm:p-7 shadow-[0_20px_50px_rgba(0,0,0,0.12)] animate-apple-in">
      <h3 class="text-[17px] font-semibold text-[#1D1D1F]">清空当前所有练习内容？</h3>
      <p class="text-[13px] text-[#6E6E73] mt-2 leading-relaxed">
        清空后，三个阶段中的所有填写记录、价值观星标与技能卡牌分类将被重置。建议先点击「预览/打印」导出 PDF 留存副本。
      </p>
      <div class="mt-6 flex items-center justify-end gap-2">
        <button type="button" onclick="closeResetModal()"
          class="px-4 py-2 rounded-full text-[13px] font-medium text-[#6E6E73] bg-[#F5F5F7] hover:bg-[#E8E8ED] transition cursor-pointer">
          取消
        </button>
        <button type="button" onclick="confirmResetAll()"
          class="px-4 py-2 rounded-full text-[13px] font-medium text-white bg-[#D70015] hover:bg-[#B80012] transition cursor-pointer">
          确认清空
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 讲师后台配置：在此粘贴 Google Apps Script 部署后的 Web App URL，即可后台静默归档
    // =========================================================================
    const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx5augAG0F0ssPUCNjU5h6ANb4fQaDgEdff1sbPsckDEzs_i2U2slwe250bEvhoDeFh/exec";

    // 本地存储键名（沿用既有键名，无缝继承已填写的数据）
    const STORAGE_DATA_KEY = "ccw_opentalk_workbench_v4";
    const STORAGE_UID_KEY = "ccw_anon_uid_v4";
    const STORAGE_SHEET_KEY = "ccw_archive_endpoint_v4";

    // =========================================================================
    // 1. Apple SF Symbols 风格 1.5px 极细单色线性 SVG 图标库（全局零系统 Emoji）
    // =========================================================================
    function svgIcon(name, sizeClass = "w-4 h-4") {
      const paths = {
        compass: `<circle cx="12" cy="12" r="9"/><polygon points="15.5 8.5 13.8 13.8 8.5 15.5 10.2 10.2 15.5 8.5"/>`,
        pencil: `<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/><path d="m14.5 5.5 3 3"/>`,
        printer: `<path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/>`,
        copy: `<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`,
        close: `<path d="M18 6 6 18"/><path d="m6 6 12 12"/>`,
        target: `<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>`,
        shuffle: `<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>`,
        rocket: `<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>`,
        sliders: `<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/>`,
        sprout: `<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>`,
        users: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
        star: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
        starFilled: `<polygon fill="currentColor" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
        search: `<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>`,
        sparkles: `<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="2.5"/>`,
        bolt: `<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`,
        battery: `<rect x="2" y="7" width="18" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="14"/>`,
        archive: `<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/>`,
        clock: `<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>`,
        lightbulb: `<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>`,
        heart: `<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>`,
        link: `<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>`,
        check: `<polyline points="20 6 9 17 4 12"/>`,
        arrowRight: `<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>`,
        arrowLeft: `<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>`,
        clover: `<circle cx="12" cy="7.5" r="3.5"/><circle cx="8" cy="13.5" r="3.5"/><circle cx="16" cy="13.5" r="3.5"/><path d="M12 16v5"/>`
      };
      const inner = paths[name] || paths.compass;
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${sizeClass} shrink-0" aria-hidden="true">${inner}</svg>`;
    }

    // =========================================================================
    // 2. 双层级导航配置（阶段一含 5 个子步骤；阶段二、三直接渲染单页）
    // =========================================================================

    // 确定性哈希：相同姓名/邮箱在不同设备上严格生成相同的 student_uid
    function computeDeterministicUID(rawName) {
      const normalized = (rawName || "").trim().toLowerCase().replace(/\s+/g, "");
      if (!normalized) {
        try {
          let anon = window.localStorage.getItem(STORAGE_UID_KEY);
          if (!anon) {
            anon = "stu_anon_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 7);
            window.localStorage.setItem(STORAGE_UID_KEY, anon);
          }
          return anon;
        } catch (e) {
          return "stu_session_" + Math.random().toString(36).substring(2, 9);
        }
      }

      let h1 = 0x811c9dc5;
      let h2 = 0x01000193;
      for (let i = 0; i < normalized.length; i++) {
        const ch = normalized.charCodeAt(i);
        h1 ^= ch;
        h1 = Math.imul(h1, 0x01000193);
        h2 ^= ch;
        h2 = Math.imul(h2, 0x85ebca6b);
      }
      const hex1 = (h1 >>> 0).toString(16).padStart(8, "0");
      const hex2 = (h2 >>> 0).toString(16).padStart(8, "0");
      return `stu_u_${hex1}${hex2}`;
    }

    // =========================================================================
    // 6. 核心分析计算：诺德尔四象限 + 1.5 三叶草模型严选提取
    // =========================================================================
    function computeNodelQuadrants() {
      const ratings = appState.step4.ratings || {};
      const motivated = [];     // 动力技能
      const developmental = []; // 发展技能
      const burnout = [];       // 耗竭技能
      const lowPriority = [];   // 非重点技能

      MOTIVATED_SKILLS_51.forEach(skill => {
        const r = ratings[skill.id];
        if (!r || !r.pref || !r.prof) return;

        const isHighPref = r.pref === "love" || r.pref === "like_lot";
        const isPosPref = isHighPref || r.pref === "like";
        const isNegPref = r.pref === "avoid" || r.pref === "dislike";

        const isProficient = r.prof === "highly_proficient" || r.prof === "proficient";
        const isDeveloping = r.prof === "developing";

        if (isHighPref && isProficient) {
          motivated.push(skill.title);
        } else if (isPosPref && isDeveloping) {
          developmental.push(skill.title);
        } else if (isNegPref && isProficient) {
          burnout.push(skill.title);
        } else if (isNegPref && isDeveloping) {
          lowPriority.push(skill.title);
        }
      });

      return { motivated, developmental, burnout, lowPriority };
    }

          return {
            id: skill.id,

            isAce: isLike,
            isBurnoutRisk: isDislike
          };
        });

      return {
        valuesList,
        valueSourceNote,
        interestText,
        interestIsFallback,
        highlyProficientSkills
      };

        .join("、");

      const summaryTrim = (appState.step3.interestSummary || "").trim();

      if (summaryTrim && flowTrim) {

      } else if (summaryTrim) {
        combinedFlowField = `【核心兴趣总结】${summaryTrim}`;
      } else {
        combinedFlowField = flowTrim;
      }

      const hpNames = clover.highlyProficientSkills.map(s => s.title).join("、");
      const rawAbilitySummary = (appState.step4.abilitySummary || "").trim();
      let combinedAbilitySummary = rawAbilitySummary;
      if (hpNames && rawAbilitySummary) {
        combinedAbilitySummary = `【非常熟练】${hpNames} ｜ ${rawAbilitySummary}`;
      } else if (hpNames) {
        combinedAbilitySummary = `【非常熟练】${hpNames}`;

          mode: "no-cors",

          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        }).catch(() => {});

    function isSubstepCompleted(subId) {
      switch (subId) {
        case "1.1":
          return Boolean(appState.step1.conversationGoal.trim() || appState.step1.selectedPills.length > 0);
        case "1.2":
          return appState.step2.selectedValues.length > 0;
        case "1.3":
          return Boolean(
            appState.step3.interestSummary.trim() ||
            appState.step3.q1Flow.trim() ||
            appState.step3.q2Curiosity.trim() ||
            appState.step3.q3Drain.trim()
          );
        case "1.4":
          return Object.keys(appState.step4.ratings).length > 0 || Boolean(appState.step4.abilitySummary.trim());
        case "1.5":
          return Boolean(appState.step5.initialDirection.trim() || appState.step5.smartGoal.trim());
        default:
          return false;
      }
    }

    function isStageCompleted(stageId) {
      if (stageId === "stage1") {
        return ["1.1", "1.2", "1.3", "1.4", "1.5"].some(id => isSubstepCompleted(id));
      }
      if (stageId === "stage2") {
        return Boolean(
          appState.stage2.currentStatus.trim() ||
          appState.stage2.devPath.trim() ||
          appState.stage2.helpDimensions.length > 0 ||
          appState.stage2.helpDetail.trim()
        );
      }
      if (stageId === "stage3") {
        return Boolean(
          appState.stage3.skillsCurrent.trim() ||
          appState.stage3.skillsFuture.trim() ||
          appState.stage3.skillsLongTerm.trim()
        );
      }
      return false;
    }

    window.navigateSwipeCard = function(delta) {
      let nextId = step4SwipeCardId + delta;
      if (nextId < 1) nextId = 51;

      step4SwipeCardId = nextId;
      renderStepView();
    };

    window.jumpToNextUnclassifiedSkill = function() {
      const ratings = appState.step4.ratings;
      let found = MOTIVATED_SKILLS_51.find(s => s.id > step4SwipeCardId && !ratings[s.id]?.pref);
      if (!found) {
        found = MOTIVATED_SKILLS_51.find(s => !ratings[s.id]?.pref);
      }
      if (found) {
        step4SwipeCardId = found.id;
        renderStepView();
      } else {
        showToast("51 张技能卡已全部分类完成");
      }
    };

    window.classifySkillPref = function(skillId, prefId, autoAdvance = false) {
      if (!appState.step4.ratings[skillId]) {
        appState.step4.ratings[skillId] = { pref: prefId, prof: "" };
      } else {
        appState.step4.ratings[skillId].pref = prefId;
      }

      if (autoAdvance) {
        const ratings = appState.step4.ratings;
        let nextUnclassified = MOTIVATED_SKILLS_51.find(s => s.id > skillId && !ratings[s.id]?.pref);
        if (!nextUnclassified) {
          nextUnclassified = MOTIVATED_SKILLS_51.find(s => !ratings[s.id]?.pref);
        }
        if (nextUnclassified) {
          step4SwipeCardId = nextUnclassified.id;
        } else if (skillId < 51) {
          step4SwipeCardId = skillId + 1;
        }
      }

      scheduleAutoSave(false);
      renderApp();
    };

    window.classifySkillProf = function(skillId, profId) {
      if (!appState.step4.ratings[skillId]) return;
      const prev = appState.step4.ratings[skillId].prof;
      const next = prev === profId ? "" : profId;
      appState.step4.ratings[skillId].prof = next;
      if (next === "highly_proficient") {
        showToast("已标记为「非常熟练」，将自动同步至 1.5 三叶草优势锚点");

        closeResetModal();
        return;

      if (appState.activeStage !== "stage1" || appState.activeSubstep !== "1.4" || step4ViewMode !== "swipe") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      const opModal = document.getElementById("onepager-modal");
      if (opModal && !opModal.classList.contains("hidden")) return;

      if (["1", "2", "3", "4", "5"].includes(e.key)) {
        e.preventDefault();
        const prefObj = PREF_LEVELS[Number(e.key) - 1];
        if (prefObj) {
          classifySkillPref(step4SwipeCardId, prefObj.id, true);
        }
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        navigateSwipeCard(-1);

        navigateSwipeCard(1);

    // =========================================================================
    // 12. HTML 转义与双层极简导航渲染
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderNavigationBars() {
      const segCtrl = document.getElementById("stage-segmented-control");
      const substepBar = document.getElementById("substep-underline-bar");
      if (!segCtrl || !substepBar) return;

      // Apple Segmented Control（阶段分段控制器）
      segCtrl.innerHTML = STAGES.map(st => {
        const isActive = appState.activeStage === st.id;
        const done = isStageCompleted(st.id);

        const cls = isActive
          ? "bg-white text-[#1D1D1F] font-semibold shadow-[0_1px_4px_rgba(0,0,0,0.08)]"
          : "text-[#6E6E73] hover:text-[#1D1D1F] font-medium";

        return `
          <button type="button" role="tab" aria-selected="${isActive}" onclick="switchStage('${st.id}')"
            class="flex-1 sm:flex-initial shrink-0 whitespace-nowrap px-4 py-1.5 rounded-[8px] text-[13px] inline-flex items-center justify-center gap-1.5 transition-all cursor-pointer ${cls}">
            <span>${st.label}</span>
            ${done ? `<span class="w-1 h-1 rounded-full ${isActive ? "bg-[#0F5C56]" : "bg-[#86868B]"}"></span>` : ""}
          </button>
        `;
      }).join("");

      const q = valueSearchQuery.trim();

          <div class="space-y-5">

            <!-- 一、【对话前】本次谈话核心目标 -->
            <section class="pb-4 hairline-b print-avoid-break">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-[14px] font-bold text-[#1D1D1F]">一、【对话前】本次谈话核心目标</h3>
                <button type="button" onclick="closeOnePagerModal(); switchSubstep('1.1');"
                  class="no-print text-[11px] text-[#86868B] hover:text-[#0F5C56] cursor-pointer">编辑</button>
              </div>
              ${s1.selectedPills.length
                ? `<div class="flex flex-wrap gap-1.5 mb-2">
                     ${s1.selectedPills.map(p => `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-[#0F5C56]/[0.08] text-[#0F5C56]">${esc(p)}</span>`).join("")}
                   </div>`
                : ""
              }
              ${s1.conversationGoal.trim()
                ? `<div class="text-[13px] text-[#1D1D1F] whitespace-pre-line leading-relaxed">${esc(s1.conversationGoal.trim())}</div>`
                : renderRuledLines("引导提示：写下希望通过本次 1 对 1 对话达成的具体共识或目标…", 2)
              }
            </section>

            <!-- 二、【对话前】职业方向与 SMART 目标 -->
            <section class="pb-4 hairline-b print-avoid-break">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-[14px] font-bold text-[#1D1D1F]">二、【对话前】职业方向与 SMART 目标</h3>
                <button type="button" onclick="closeOnePagerModal(); switchSubstep('1.5');"
                  class="no-print text-[11px] text-[#86868B] hover:text-[#0F5C56] cursor-pointer">编辑</button>
              </div>
              <div class="text-[12px] mb-1.5">
                <span class="text-[#86868B]">初始方向：</span>
                <span class="font-medium text-[#1D1D1F]">${esc(s5.initialDirection.trim()) || "—"}</span>
              </div>
              ${s5.smartGoal.trim()
                ? `<div class="text-[13px] font-medium text-[#1D1D1F] whitespace-pre-line leading-relaxed">${esc(s5.smartGoal.trim())}</div>`
                : renderRuledLines("引导提示：结合左侧三叶草锚点，写下一句具体、可衡量、有时限的职业发展目标…", 2)
              }
              ${checkedSmartObjs.length
                ? `<div class="flex flex-wrap gap-1.5 mt-2">
                     ${checkedSmartObjs.map(i => `<span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-[#F5F5F7] text-[#0F5C56]">✓ ${esc(i.label)}</span>`).join("")}
                   </div>`
                : ""
              }
            </section>

            <!-- 三、【对话中】与上级探讨的三维提纲 -->
            <section class="pb-4 hairline-b print-avoid-break">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-[14px] font-bold text-[#1D1D1F]">三、【对话中】与上级探讨的三维提纲</h3>
                <button type="button" onclick="closeOnePagerModal(); switchStage('stage2');"
                  class="no-print text-[11px] text-[#86868B] hover:text-[#0F5C56] cursor-pointer">编辑</button>
              </div>
              <div class="space-y-2.5">
                <div>
                  <div class="text-[12px] font-semibold text-[#6E6E73]">1. 现状分析（岗位核心要求 / 目标与差距）</div>
                  ${st2.currentStatus.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st2.currentStatus.trim())}</div>`
                    : renderRuledLines("引导提示：当前岗位所需关键技能及现阶段差距…", 1)
                  }
                </div>
                <div>
                  <div class="text-[12px] font-semibold text-[#6E6E73]">2. 发展路径（已做积累 / 下一步行动）</div>
                  ${st2.devPath.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st2.devPath.trim())}</div>`
                    : renderRuledLines("引导提示：已做准备与下一步能力补齐路径…", 1)
                  }
                </div>
                <div>
                  <div class="text-[12px] font-semibold text-[#6E6E73]">3. 寻求帮助（时间 / 理念 / 机会 / 情绪 / 关系 / 经验）</div>
                  ${selectedHelpObjects.length
                    ? `<div class="flex flex-wrap gap-1 mt-1 mb-0.5">
                         ${selectedHelpObjects.map(h => `<span class="px-2 py-0.5 rounded-md text-[10px] font-medium bg-[#0F5C56]/[0.08] text-[#0F5C56]">${h.label}</span>`).join("")}
                       </div>`
                    : ""
                  }
                  ${st2.helpDetail.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st2.helpDetail.trim())}</div>`
                    : renderRuledLines("引导提示：写下希望上级提供的项目机会、反馈与资源支持…", 1)
                  }
                </div>
              </div>
            </section>

            <!-- 四、【对话后】三层能力发展清单 -->
            <section class="pb-4 hairline-b print-avoid-break">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-[14px] font-bold text-[#1D1D1F]">四、【对话后】三层能力发展清单</h3>
                <button type="button" onclick="closeOnePagerModal(); switchStage('stage3');"
                  class="no-print text-[11px] text-[#86868B] hover:text-[#0F5C56] cursor-pointer">编辑</button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <div class="text-[11px] font-semibold text-[#6E6E73]">在当前岗位上</div>
                  ${st3.skillsCurrent.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st3.skillsCurrent.trim())}</div>`
                    : renderRuledLines("当下胜任所需…", 2)
                  }
                </div>
                <div>
                  <div class="text-[11px] font-semibold text-[#6E6E73]">未来的职位</div>
                  ${st3.skillsFuture.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st3.skillsFuture.trim())}</div>`
                    : renderRuledLines("目标岗位储备…", 2)
                  }
                </div>
                <div>
                  <div class="text-[11px] font-semibold text-[#6E6E73]">保持长期竞争力</div>
                  ${st3.skillsLongTerm.trim()
                    ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed mt-0.5">${esc(st3.skillsLongTerm.trim())}</div>`
                    : renderRuledLines("长期能力护城河…", 2)
                  }
                </div>
              </div>
            </section>

            <!-- 五、【面谈现场记录】主管反馈与 Next Steps -->
            <section class="print-avoid-break">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-[14px] font-bold text-[#0F5C56]">五、【面谈现场记录】主管反馈与 Next Steps</h3>
                <span class="text-[11px] text-[#86868B]">支持现场输入或导出 PDF 后手写记录</span>
              </div>

              <textarea rows="3"
                oninput="onFieldChange('onePager', 'liveNotes', this.value)"
                placeholder="记录主管/导师的核心反馈、双方达成的关键共识、具体行动项（Action Items）及下次跟进时间节点..."
                class="no-print w-full p-3.5 text-[13px] apple-field leading-relaxed">${esc(op.liveNotes)}</textarea>

              <div class="hidden print:block">
                ${op.liveNotes.trim()
                  ? `<div class="text-[12px] text-[#1D1D1F] whitespace-pre-line leading-relaxed">${esc(op.liveNotes.trim())}</div>`
                  : renderRuledLines("主管反馈、关键共识与下一步行动计划（Next Steps）：", 3)
                }
              </div>
            </section>

          </div>
        </div>
      `;
    }

    // =========================================================================
    // 15. 主视图路由分发与初始化
    // =========================================================================
    function injectStaticIcons() {
      const slots = {
        "brand-icon-slot": svgIcon("compass", "w-4 h-4"),
        "header-pencil-slot": svgIcon("pencil", "w-3.5 h-3.5"),
        "header-print-icon-slot": svgIcon("printer", "w-3.5 h-3.5"),
        "modal-copy-icon": svgIcon("copy", "w-3.5 h-3.5"),
        "modal-print-icon": svgIcon("printer", "w-3.5 h-3.5"),
        "modal-close-icon": svgIcon("close", "w-4 h-4")
      };
      Object.entries(slots).forEach(([id, svg]) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = svg;
      });
    }

    function renderStepView() {
      const view = document.getElementById("step-view");
      if (!view) return;

      view.classList.remove("animate-apple-in");
      void view.offsetWidth;
      view.classList.add("animate-apple-in");

      if (appState.activeStage === "stage2") {
        view.innerHTML = renderStage2();
      } else if (appState.activeStage === "stage3") {
        view.innerHTML = renderStage3();
      } else {
        switch (appState.activeSubstep) {
          case "1.1": view.innerHTML = renderSubstep1_1(); break;
          case "1.2": view.innerHTML = renderSubstep1_2(); break;
          case "1.3": view.innerHTML = renderSubstep1_3(); break;
          case "1.4": view.innerHTML = renderSubstep1_4(); break;
          case "1.5": view.innerHTML = renderSubstep1_5(); break;
          default: view.innerHTML = renderSubstep1_1();
        }
      }
    }

    function renderApp() {
      const nameInput = document.getElementById("header-student-name");
      if (nameInput && nameInput.value !== appState.studentName) {
        nameInput.value = appState.studentName || "";
      }
      renderNavigationBars();
      renderStepView();
    }

    window.addEventListener("DOMContentLoaded", () => {
      injectStaticIcons();
      checkQueryArchiveParam();
      loadLocalState();
      renderApp();
    });
  </script>
</body>
</html>
