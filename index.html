      border-color: #0F766E;

    // =========================================================================
    // 5. 诺德尔四象限能力诊断实时计算引擎
    // =========================================================================
    function computeNodelQuadrants() {
      const ratings = appState.step4.ratings || {};
      const motivated = [];     // ⚡ 动力技能（核心王牌区）
      const developmental = []; // 🌱 发展技能（潜力成长区）
      const burnout = [];       // 🔋 耗竭技能（警惕厌烦区）
      const lowPriority = [];   // 📦 非重点技能（低优规避区）
      const supporting = [];    // 喜欢使用 + 熟练/非常熟练（稳健支撑）

      MOTIVATED_SKILLS_51.forEach(skill => {
        const r = ratings[skill.id];
        if (!r || !r.pref || !r.prof) return;

        const isHighPref = r.pref === "love" || r.pref === "like_lot";
        const isPosPref = isHighPref || r.pref === "like";
        const isNegPref = r.pref === "avoid" || r.pref === "dislike";

        const isProficient = r.prof === "highly_proficient" || r.prof === "proficient";
        const isDeveloping = r.prof === "developing";

        if (isHighPref && isProficient) {
          motivated.push(skill.title);
        } else if (isPosPref && isDeveloping) {
          developmental.push(skill.title);
        } else if (isNegPref && isProficient) {
          burnout.push(skill.title);
        } else if (isNegPref && isDeveloping) {
          lowPriority.push(skill.title);
        } else if (r.pref === "like" && isProficient) {
          supporting.push(skill.title);
        }
      });

      return { motivated, developmental, burnout, lowPriority, supporting };
    }

    function getEffectiveArchiveUrl() {

      }
      try {

      return "";

    function buildArchivePayload() {
      const quads = computeNodelQuadrants();
      const helpLabels = STEP6_HELP_PILLS

      return {
        student_uid: getOrCreateStudentUID(),
        student_name: (appState.studentName || "").trim() || "未署名学员",
        updated_at: getFormattedTimestamp(),
        step1_pills: appState.step1.selectedPills.join("、"),
        step1_conversation_goal: appState.step1.conversationGoal || "",
        step2_values_10: appState.step2.selectedValues.join("、"),
        step2_values_top3: appState.step2.top3Values.join("、"),
        step3_q1_flow: appState.step3.q1Flow || "",
        step3_q2_curiosity: appState.step3.q2Curiosity || "",
        step3_q3_drain: appState.step3.q3Drain || "",
        step4_motivated_skills: quads.motivated.join("、"),
        step4_developmental_skills: quads.developmental.join("、"),
        step4_burnout_skills: quads.burnout.join("、"),
        step4_low_priority_skills: quads.lowPriority.join("、"),
        step4_ability_summary: appState.step4.abilitySummary || "",
        step5_initial_direction: appState.step5.initialDirection || "",
        step5_smart_goal: appState.step5.smartGoal || "",
        step5_smart_checks: appState.step5.smartChecks.join("、"),
        step6_current_status: appState.step6.currentStatus || "",

        step7_skills_longterm: appState.step7.skillsLongTerm || ""
      };
    }

    function syncCloudSilently() {
      const targetUrl = getEffectiveArchiveUrl();
      if (!targetUrl) return;
      try {
        const payload = JSON.stringify(buildArchivePayload());
        fetch(targetUrl, {
          method: "POST",
          mode: "no-cors",
          keepalive: true,
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        }).catch(() => {});
      } catch (e) {}
    }

    function isStepCompleted(stepId) {
      switch (stepId) {
        case 1:
          return Boolean(appState.step1.conversationGoal.trim() || appState.step1.selectedPills.length > 0);
        case 2:
          return appState.step2.selectedValues.length > 0;
        case 3:
          return Boolean(appState.step3.q1Flow.trim() || appState.step3.q2Curiosity.trim() || appState.step3.q3Drain.trim());
        case 4:
          return Object.keys(appState.step4.ratings).length > 0 || Boolean(appState.step4.abilitySummary.trim());
        case 5:
          return Boolean(appState.step5.initialDirection.trim() || appState.step5.smartGoal.trim());
        case 6:
          return Boolean(appState.step6.currentStatus.trim() || appState.step6.devPath.trim() || appState.step6.helpDimensions.length > 0 || appState.step6.helpDetail.trim());
        case 7:
          return Boolean(appState.step7.skillsCurrent.trim() || appState.step7.skillsFuture.trim() || appState.step7.skillsLongTerm.trim());
        case 8:
          return [1, 2, 3, 4, 5, 6, 7].some(id => isStepCompleted(id));
        default:
          return false;
      }

      } else {
        appState.step4.ratings[skillId].pref = prefId;

      if (autoAdvance) {
        const ratings = appState.step4.ratings;
        let nextUnclassified = MOTIVATED_SKILLS_51.find(s => s.id > skillId && !ratings[s.id]?.pref);
        if (!nextUnclassified) {
          nextUnclassified = MOTIVATED_SKILLS_51.find(s => !ratings[s.id]?.pref);
        }
        if (nextUnclassified) {
          step4SwipeCardId = nextUnclassified.id;

      }

      renderApp();

    document.addEventListener("keydown", (e) => {
      if (appState.currentStep !== 4 || step4ViewMode !== "swipe") return;
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      const resetModal = document.getElementById("reset-confirm-modal");
      const cfgModal = document.getElementById("archive-config-modal");
      if ((resetModal && !resetModal.classList.contains("hidden")) ||
          (cfgModal && !cfgModal.classList.contains("hidden"))) return;

      if (["1", "2", "3", "4", "5"].includes(e.key)) {
        e.preventDefault();
        const prefObj = PREF_LEVELS[Number(e.key) - 1];
        if (prefObj) {
          classifySkillPref(step4SwipeCardId, prefObj.id, true);
        }
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        navigateSwipeCard(-1);

        e.preventDefault();
        navigateSwipeCard(1);

    function generatePlainSummaryText() {
      const quads = computeNodelQuadrants();

    window.copyFullSummaryText = function() {

      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (ok) {
        showToast("✓ 已复制完整文本摘要，可直接粘贴至 Notion / 微信 / Docs");

    // =========================================================================
    // 10. HTML 转义与共用组件渲染
    // =========================================================================
    function esc(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderNavGrid() {
      const grid = document.getElementById("step-nav-grid");
      if (!grid) return;

      grid.innerHTML = NAV_STEPS.map(step => {
        const isActive = appState.currentStep === step.id;
        const done = isStepCompleted(step.id);

        let btnStyle = "bg-white text-slate-600 border-[#E2E8F0] hover:border-calmteal-600 hover:text-calmteal-800";
        if (isActive) {
          btnStyle = "bg-calmteal-700 text-white border-calmteal-700 shadow-2xs font-bold";
        } else if (done) {
          btnStyle = "bg-calmteal-50/70 text-calmteal-900 border-calmteal-200 hover:border-calmteal-600 font-semibold";
        }

        const dotHtml = done
          ? `<span class="w-1.5 h-1.5 rounded-full shrink-0 ${isActive ? "bg-warmamber-300" : "bg-calmteal-600"}"></span>`
          : `<span class="w-1.5 h-1.5 rounded-full shrink-0 ${isActive ? "bg-white/40" : "bg-slate-200"}"></span>`;

        return `
          <button type="button" onclick="switchStep(${step.id})"
            class="px-2.5 py-2 rounded-xl border text-[11px] sm:text-xs font-medium flex items-center justify-between gap-1.5 transition-all cursor-pointer ${btnStyle}">
            <span class="truncate">${step.label}</span>
            ${dotHtml}
          </button>
        `;
      }).join("");
    }

    function buildValuesPoolHTML() {
      const s2 = appState.step2;
      const isFull = s2.selectedValues.length >= 10;
      const allWords = [...s2.customValues, ...ALL_112_VALUES];

      let baseList = allWords;
      if (activeValueGroup !== "all") {
        const grp = VALUE_GROUPS.find(g => g.id === activeValueGroup);
        baseList = grp ? grp.words : allWords;
      }

      const q = valueSearchQuery.trim();
      const filtered = q ? allWords.filter(w => w.includes(q)) : baseList;
      const exactMatch = q && allWords.includes(q);

      let customBanner = "";
      if (q && !exactMatch) {
        customBanner = `
          <div class="mb-3 p-3 rounded-xl bg-calmteal-50 border border-calmteal-200 flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs text-calmteal-900">词库中暂无「<strong>${esc(q)}</strong>」，按回车或点击右侧按钮添加：</span>
            <button type="button" onclick="addCustomValueWord()"
              class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-calmteal-700 text-white hover:bg-calmteal-800 transition">
              + 添加「${esc(q)}」
            </button>
          </div>
        `;
      }

      return `
        ${customBanner}
        <div class="flex flex-wrap gap-2">
          ${filtered.map(word => {
            const selected = s2.selectedValues.includes(word);
            const starred = s2.top3Values.includes(word);

            let cls = "bg-[#F8F7F4] text-slateink border-[#E2E8F0] hover:border-calmteal-600 hover:bg-calmteal-50/70";
            if (starred) {
              cls = "bg-warmamber-500 text-white border-warmamber-600 font-bold shadow-2xs";
            } else if (selected) {
              cls = "bg-calmteal-700 text-white border-calmteal-700 font-semibold shadow-2xs";
            } else if (isFull) {
              cls = "bg-[#F8F7F4] text-slate-400 border-[#E2E8F0] opacity-50 hover:opacity-80";
            }

            return `
              <button type="button" onclick="toggleValueWord('${esc(word)}')"
                class="px-3.5 py-2 rounded-xl text-xs sm:text-sm border transition-all ${cls}">
                ${starred ? "★ " : selected ? "✓ " : ""}${esc(word)}
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

                      </div>
                      <div class="p-3 rounded-lg bg-white border border-warmamber-200">
                        <div class="font-bold text-warmamber-800 mb-1">🌱 发展技能（潜力成长）</div>
                        <div class="text-slateink leading-relaxed">${quads.developmental.length ? esc(quads.developmental.join("、")) : "—"}</div>
                      </div>
                      <div class="p-3 rounded-lg bg-white border border-[#E2E8F0]">
                        <div class="font-bold text-slate-600 mb-1">🔋 耗竭技能（警惕厌烦）</div>
                        <div class="text-slate-600 leading-relaxed">${quads.burnout.length ? esc(quads.burnout.join("、")) : "—"}</div>
                      </div>
                    </div>
                    ${s4.abilitySummary.trim()
                      ? `<div class="pt-1 text-xs text-slate-700"><strong>一句话总结：</strong>${esc(s4.abilitySummary.trim())}</div>`
                      : ""
                    }
                  </div>
                </div>
              </section>

              <!-- 三、职业发展方向与 SMART 目标 -->
              <section class="print-avoid-break">
                <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-2 mb-3">
                  <h3 class="text-sm sm:text-base font-bold text-calmteal-800">三、【对话前】职业发展方向与 SMART 目标</h3>
                  <button type="button" onclick="switchStep(5)" class="no-print text-xs text-slate-400 hover:text-calmteal-700">编辑</button>
                </div>
                <div class="p-4 rounded-xl bg-[#F8F7F4] border border-[#E2E8F0] space-y-2.5">
                  <div>
                    <span class="text-xs font-bold text-slate-500">初始职业发展方向：</span>
                    <span class="text-sm font-semibold text-slateink">${esc(s5.initialDirection.trim()) || "—"}</span>
                  </div>
                  <div>
                    <div class="text-xs font-bold text-slate-500 mb-1">完整 SMART 职业发展目标：</div>
                    ${renderTextOrDash(s5.smartGoal)}
                  </div>
                  ${checkedSmartObjs.length
                    ? `<div class="flex flex-wrap gap-1.5 pt-1">
                         ${checkedSmartObjs.map(i => `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-calmteal-100 text-calmteal-800">✓ ${esc(i.label)}</span>`).join("")}
                       </div>`
                    : ""
                  }
                </div>
              </section>

              <!-- 四、对话中沟通提纲 & 五、对话后技能沉淀清单 -->
              <section class="print-avoid-break grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-2 mb-3">
                    <h3 class="text-sm sm:text-base font-bold text-calmteal-800">四、【对话中】沟通提纲</h3>
                    <button type="button" onclick="switchStep(6)" class="no-print text-xs text-slate-400 hover:text-calmteal-700">编辑</button>
                  </div>
                  <div class="p-4 rounded-xl bg-[#F8F7F4] border border-[#E2E8F0] space-y-3">
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-0.5">现状分析</div>
                      ${renderTextOrDash(s6.currentStatus)}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-0.5">发展路径</div>
                      ${renderTextOrDash(s6.devPath)}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-1">寻求帮助</div>
                      ${selectedHelpObjects.length
                        ? `<div class="flex flex-wrap gap-1 mb-1.5">
                             ${selectedHelpObjects.map(h => `<span class="px-2 py-0.5 rounded-md text-xs font-semibold bg-calmteal-100 text-calmteal-800">${h.label}</span>`).join("")}
                           </div>`
                        : ""
                      }
                      ${renderTextOrDash(s6.helpDetail)}
                    </div>
                  </div>
                </div>

                <div>
                  <div class="flex items-center justify-between border-b border-[#E2E8F0] pb-2 mb-3">
                    <h3 class="text-sm sm:text-base font-bold text-calmteal-800">五、【对话后】技能沉淀清单</h3>
                    <button type="button" onclick="switchStep(7)" class="no-print text-xs text-slate-400 hover:text-calmteal-700">编辑</button>
                  </div>
                  <div class="p-4 rounded-xl bg-[#F8F7F4] border border-[#E2E8F0] space-y-3">
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-0.5">在当前岗位上</div>
                      ${renderTextOrDash(s7.skillsCurrent)}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-0.5">未来的职位</div>
                      ${renderTextOrDash(s7.skillsFuture)}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-slate-500 mb-0.5">保持长期竞争力</div>
                      ${renderTextOrDash(s7.skillsLongTerm)}
                    </div>
                  </div>
                </div>
              </section>

            </div>
          </div>
        </div>
      `;
    }

    function renderStepView() {
      const view = document.getElementById("step-view");
      if (!view) return;

      view.classList.remove("animate-reveal");
      void view.offsetWidth;
      view.classList.add("animate-reveal");

      switch (appState.currentStep) {
        case 1: view.innerHTML = renderStep1(); break;
        case 2: view.innerHTML = renderStep2(); break;
        case 3: view.innerHTML = renderStep3(); break;
        case 4: view.innerHTML = renderStep4(); break;
        case 5: view.innerHTML = renderStep5(); break;
        case 6: view.innerHTML = renderStep6(); break;
        case 7: view.innerHTML = renderStep7(); break;
        case 8: view.innerHTML = renderStep8(); break;
        default: view.innerHTML = renderStep1();
      }
    }

    function renderApp() {
      const nameInput = document.getElementById("header-student-name");
      if (nameInput && nameInput.value !== appState.studentName) {
        nameInput.value = appState.studentName || "";
      }
      renderNavGrid();
      renderStepView();
    }

    // 初始化启动
    window.addEventListener("DOMContentLoaded", () => {
      checkQueryArchiveParam();
      getOrCreateStudentUID();
      loadLocalState();
      renderApp();
    });
  </script>
</body>
</html>
